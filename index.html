<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    overflow:hidden;
    font-family:sans-serif;
}

/* nền */
.app{
    width:100vw;
    height:100vh;
    max-width:420px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(270deg,#ff9ecb,#ffc1cc,#ff6fa5,#ffd6e0);
    background-size:600% 600%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* layout */
.main{
    position:absolute;
    top:50%;
    width:100%;
    transform:translateY(-50%);
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    z-index:2;
}

/* avatar box */
.avatar-box{
    position:relative;
    width:95px;
    height:95px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* glow tim */
.avatar-box::before{
    content:"💖";
    position:absolute;
    font-size:110px;
    opacity:0.25;
    filter:blur(8px);
}

/* avatar */
.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    background-size:cover;
    z-index:2;
    box-shadow:0 0 15px #ff4d88;
}

.name,.birthday{
    color:#fff;
    text-align:center;
    font-size:12px;
}

.center{text-align:center;color:#fff}

/* 💗 tim */
.love-heart{
    position:absolute;
    color:#ff4d88;
    opacity:0;
    animation:pop 2s ease forwards;
}

@keyframes pop{
    0%{transform:scale(0.5);opacity:0}
    50%{transform:scale(1.2);opacity:1}
    100%{transform:scale(1);opacity:0}
}

/* caption */
.caption{
    position:absolute;
    bottom:100px;
    width:100%;
    text-align:center;
    font-size:16px;
    color:#fff;
    font-weight:bold;
    animation:fade 4s infinite;
}

@keyframes fade{
    0%,100%{opacity:0}
    50%{opacity:1}
}

/* nút */
.btn{
    position:absolute;
    top:15px;
    right:15px;
    background:#ff4d88;
    border:none;
    color:#fff;
    padding:8px 12px;
    border-radius:20px;
}
</style>
</head>

<body>

<div class="app" id="app">

<button class="btn" onclick="playMusic()">🎵</button>

<div class="main">

<!-- NAM -->
<div>
<div class="avatar-box">
<div class="avatar" style="background-image:url('https://files.catbox.moe/959x81.jpg')"></div>
</div>
<div class="name">Trần Thanh Giàu 💙</div>
<div class="birthday">08/02/2009</div>
</div>

<!-- GIỮA -->
<div class="center">
<div style="font-size:40px">💖</div>
<div>16-02-2026</div>
<div id="time"></div>
</div>

<!-- NỮ -->
<div>
<div class="avatar-box">
<div class="avatar" style="background-image:url('https://files.catbox.moe/gd4kzo.jpg')"></div>
</div>
<div class="name">Hoàng Hải Yến 💗</div>
<div class="birthday">02/11/2009</div>
</div>

</div>

<div class="caption" id="cap">Yêu nhau mỗi ngày 💕</div>

</div>

<audio id="audio" src="https://files.catbox.moe/w6hocc.mp3"></audio>

<script>
// TIME
const start=new Date("2026-02-16");
setInterval(()=>{
let d=Math.floor((new Date()-start)/86400000);
time.innerHTML=d+" ngày 💕";
},1000);

// NHẠC
let audio=document.getElementById("audio");
function playMusic(){
    audio.volume=0.7;
    audio.play();
}

// 💗 TIM NHỎ KHÔNG ĐÈ UI
setInterval(()=>{
    for(let i=0;i<2;i++){
        let h=document.createElement("div");
        h.className="love-heart";
        h.innerHTML="💗";

        let x,y;

        do{
            x=Math.random()*100;
            y=Math.random()*100;
        }
        while(
            (x<30 && y>25 && y<75) ||      // avatar trái
            (x>35 && x<65 && y>35 && y<70) || // giữa
            (x>70 && y>25 && y<75)         // avatar phải
        );

        h.style.left=x+"%";
        h.style.top=y+"%";
        h.style.fontSize=(18+Math.random()*12)+"px";

        app.appendChild(h);
        setTimeout(()=>h.remove(),2000);
    }
},800);

// CAPTION
const caps=[
"Yêu nhau mỗi ngày 💕",
"Mãi bên nhau nha 🥺",
"Anh yêu em 💖",
"Em yêu anh 💗",
"Cùng nhau đến cuối ❤️"
];

setInterval(()=>{
cap.innerHTML=caps[Math.floor(Math.random()*caps.length)];
},3000);

</script>

</body>
</html>
```
